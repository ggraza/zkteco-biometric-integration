name: Promote develop to production

on:
  push:
    branches:
      - develop
  workflow_dispatch:

# Queue promotions rather than cancelling them: a cancelled run could leave
# a PR open with auto-merge never enabled.
concurrency:
  group: promote-to-version-16
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    name: Open promotion PR and enable auto-merge
    runs-on: ubuntu-latest

    steps:
      - name: Clone
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open or reuse the promotion PR
        env:
          # Must NOT be the default GITHUB_TOKEN: PRs it opens do not trigger
          # `pull_request` workflows, so CI would never report and auto-merge
          # would wait forever.
          GH_TOKEN: ${{ secrets.PROMOTE_TOKEN }}
        run: |
          set -euo pipefail

          if [ "$(git rev-list --count origin/version-16..origin/develop)" -eq 0 ]; then
            echo "version-16 already contains develop. Nothing to promote."
            exit 0
          fi

          pr=$(gh pr list --base version-16 --head develop --state open \
                 --json number --jq '.[0].number // empty')

          if [ -z "$pr" ]; then
            gh pr create \
              --base version-16 \
              --head develop \
              --title "Promote develop to version-16" \
              --body "Automated promotion of \`develop\` to \`version-16\`.

          Merges once all required checks pass. Opened by \`${{ github.workflow }}\`
          for ${{ github.sha }}."

            pr=$(gh pr list --base version-16 --head develop --state open \
                   --json number --jq '.[0].number')
            echo "Opened PR #$pr"
          else
            echo "Reusing open PR #$pr"
          fi

          # A merge commit, not a squash: squashing would rewrite develop's
          # commits onto version-16 and permanently diverge the two branches.
          gh pr merge "$pr" --auto --merge
